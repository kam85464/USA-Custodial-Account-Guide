name: PR Checklist Enforcer

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  pull_requests: write
  contents: read

jobs:
  check-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Check Checklist Status
        uses: actions/github-script@v7
        with:
          script: |
            let prBody = context.payload.pull_request.body || "";
            prBody = prBody.replace(//g, "");
            
            const uncheckedRegex = /^[\s]*[-*]\s+\[\s\]/gm;
            const hasUnchecked = uncheckedRegex.test(prBody);
            
            if (hasUnchecked) {
              core.setFailed("Cannot merge: One or more checklist items are incomplete.");
            } else {
              console.log("✅ All checklist items are completed!");
            }
