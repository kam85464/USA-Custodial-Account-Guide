name: PR Checklist Enforcer

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Check Checklist Status
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || "";
            
            // Split the description text by lines to analyze cleanly
            const lines = prBody.split(/\r?\n/);
            
            // Check if any line contains an open markdown checkbox like "- [ ]" or "* [ ]"
            let hasUnchecked = false;
            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith("- [ ]") || trimmed.startsWith("* [ ]")) {
                hasUnchecked = true;
                break;
              }
            }
            
            if (hasUnchecked) {
              core.setFailed("Cannot merge: One or more checklist items are incomplete.");
            } else {
              console.log("✅ All checklist items are completed!");
            }
